<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TU Rangsit Map</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#faf7f2;color:#292329}
header{background:#791526;color:white;padding:22px}
header h1{margin:0}
main{max-width:1000px;margin:auto;padding:22px}
input,select,button{font:inherit;padding:11px;border-radius:8px;border:1px solid #ddd}
input,select{width:100%;margin:5px 0 12px}
button{cursor:pointer;background:#791526;color:white;border:0}
.card{background:white;border:1px solid #eee1dc;border-radius:14px;padding:18px;margin:12px 0}
.route{background:#f6e9e8;padding:12px;border-radius:9px;margin:12px 0}
small{color:#777}
iframe{width:100%;height:260px;border:0;border-radius:10px}
.hidden{display:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>📍 TU Rangsit Map</h1>
  <p>ค้นหาสถานที่และดูวิดีโอแนะนำเส้นทางในมหาวิทยาลัย</p>
</header>

<main>
  <section class="card">
    <h2>ค้นหาสถานที่</h2>
    <input id="search" placeholder="พิมพ์ชื่อสถานที่ เช่น SC123">
    <div id="places"></div>
  </section>

  <section class="card">
    <h2>วิดีโอแนะนำเส้นทาง</h2>
    <label>เลือกจุดเริ่มต้น</label>
    <select id="from"></select>

    <label>เลือกจุดหมาย</label>
    <select id="to"></select>

    <button onclick="showRoute()">ค้นหาเส้นทาง</button>
    <div id="routeResult"></div>
  </section>

  <section class="card">
    <h2>สำหรับผู้ดูแลระบบ</h2>
    <p><small>ตัวอย่างนี้ยังไม่มีระบบล็อกอินที่ปลอดภัย</small></p>

    <label>ชื่อสถานที่</label>
    <input id="name" placeholder="ชื่อสถานที่">

    <label>จุดเริ่มต้น</label>
    <select id="videoFrom"></select>

    <label>จุดหมายปลายทาง</label>
    <select id="videoTo"></select>

    <label>ลิงก์วิดีโอ YouTube</label>
    <input id="video" placeholder="https://www.youtube.com/watch?v=...">

    <label>รายละเอียดสถานที่</label>
    <input id="description" placeholder="รายละเอียดเพิ่มเติม">

    <button onclick="addPlace()">เพิ่มสถานที่และเส้นทาง</button>
    <div id="adminList"></div>
  </section>
</main>

<script>
const initialNames = [
  "ยิม 4–5", "คณะสังคม", "สระว่ายน้ำ", "ลานพญานาค",
  "SC123", "ศึกษาศาสตร์", "ศกร", "บร.1", "ป๋วย",
  "กรีน", "ศกรบอกทางขั้นสอง", "หอใน",
  "อินเตอร์โซน", "ทิวสน", "ถังฟุ่", "เชียงหนึ่ง", "วิศวะ"
];

let places = JSON.parse(localStorage.getItem("tuPlaces") || "null") ||
  initialNames.map((name, i) => ({
    id: i + 1,
    name,
    description: "",
    routes: []
  }));

function save() {
  localStorage.setItem("tuPlaces", JSON.stringify(places));
}

function escapeHTML(text) {
  return String(text).replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;",
    '"':"&quot;", "'":"&#39;"
  }[c]));
}

function optionsHTML(selected = "") {
  return places.map(p =>
    `<option value="${p.id}" ${String(p.id) === String(selected) ? "selected" : ""}>${escapeHTML(p.name)}</option>`
  ).join("");
}

function refreshSelects() {
  ["from", "to", "videoFrom", "videoTo"].forEach(id => {
    const el = document.getElementById(id);
    const previous = el.value;
    el.innerHTML = optionsHTML(previous);
  });
}

function renderPlaces() {
  const query = document.getElementById("search").value.toLowerCase();
  const results = places.filter(p =>
    p.name.toLowerCase().includes(query)
  );

  document.getElementById("places").innerHTML = results.map(p => `
    <div class="card">
      <h3>${escapeHTML(p.name)}</h3>
      <p>${escapeHTML(p.description || "ยังไม่มีรายละเอียด")}</p>
      ${p.routes.map(r => `
        <div class="route">
          <b>${escapeHTML(getName(r.from))} → ${escapeHTML(getName(r.to))}</b>
          <p><a href="${escapeHTML(r.url)}" target="_blank" rel="noopener">เปิดวิดีโอ</a></p>
        </div>
      `).join("")}
    </div>
  `).join("") || "<p>ไม่พบสถานที่</p>";
}

function getName(id) {
  return places.find(p => String(p.id) === String(id))?.name || "ไม่ทราบสถานที่";
}

function showRoute() {
  const from = document.getElementById("from").value;
  const to = document.getElementById("to").value;
  const result = document.getElementById("routeResult");

  if (from === to) {
    result.innerHTML = "<p>กรุณาเลือกจุดเริ่มต้นและจุดหมายที่แตกต่างกัน</p>";
    return;
  }

  const routes = places.flatMap(p => p.routes)
    .filter(r => String(r.from) === from && String(r.to) === to);

  result.innerHTML = routes.length ? routes.map(r => `
    <div class="route">
      <h3>${escapeHTML(getName(r.from))} → ${escapeHTML(getName(r.to))}</h3>
      ${youtubeEmbed(r.url)}
      <p><a href="${escapeHTML(r.url)}" target="_blank" rel="noopener">เปิดวิดีโอใน YouTube</a></p>
    </div>
  `).join("") : "<p>ยังไม่มีวิดีโอสำหรับเส้นทางนี้</p>";
}

function youtubeEmbed(url) {
  try {
    const u = new URL(url);
    let id = "";
    if (u.hostname === "youtu.be") id = u.pathname.slice(1);
    if (u.hostname.endsWith("youtube.com")) {
      id = u.searchParams.get("v") || "";
      if (!id && u.pathname.startsWith("/embed/")) {
        id = u.pathname.split("/")[2];
      }
    }
    if (/^[\w-]{11}$/.test(id)) {
      return `<iframe src="https://www.youtube-nocookie.com/embed/${id}" allowfullscreen title="วิดีโอเส้นทาง"></iframe>`;
    }
  } catch {}
  return "<p>ไม่สามารถแสดงตัวอย่างวิดีโอได้ กรุณาเปิดผ่านลิงก์</p>";
}

function addPlace() {
  const name = document.getElementById("name").value.trim();
  const from = document.getElementById("videoFrom").value;
  const to = document.getElementById("videoTo").value;
  const url = document.getElementById("video").value.trim();
  const description = document.getElementById("description").value.trim();

  if (!name || !from || !to || !url) {
    alert("กรุณากรอกชื่อสถานที่ จุดเริ่มต้น จุดหมาย และลิงก์วิดีโอ");
    return;
  }
  if (from === to) {
    alert("จุดเริ่มต้นและจุดหมายต้องแตกต่างกัน");
    return;
  }

  try {
    const parsed = new URL(url);
    if (!["https:", "http:"].includes(parsed.protocol)) throw Error();
  } catch {
    alert("กรุณาใส่ URL ที่ถูกต้อง");
    return;
  }

  let place = places.find(p => p.name.toLowerCase() === name.toLowerCase());
  if (!place) {
    place = {
      id: Date.now(),
      name,
      description,
      routes: []
    };
    places.push(place);
  } else if (description) {
    place.description = description;
  }

  place.routes.push({
    id: Date.now(),
    from,
    to,
    url
  });

  save();
  refreshSelects();
  renderPlaces();
  renderAdminList();
  alert("เพิ่มเส้นทางเรียบร้อยแล้ว");
}

function renderAdminList() {
  document.getElementById("adminList").innerHTML = places.map(p => `
    <div class="route">
      <b>${escapeHTML(p.name)}</b>
      <p>${p.routes.length} เส้นทาง</p>
      ${p.routes.map(r => `
        <div>${escapeHTML(getName(r.from))} → ${escapeHTML(getName(r.to))}
          <button onclick="deleteRoute(${p.id},${r.id})">ลบเส้นทาง</button>
        </div>
      `).join("")}
    </div>
  `).join("");
}

function deleteRoute(placeId, routeId) {
  const place = places.find(p => p.id === placeId);
  if (!place || !confirm("ต้องการลบเส้นทางนี้หรือไม่?")) return;
  place.routes = place.routes.filter(r => r.id !== routeId);
  save();
  renderPlaces();
  renderAdminList();
}

document.getElementById("search").addEventListener("input", renderPlaces);
refreshSelects();
renderPlaces();
renderAdminList();
</script>
</body>
</html>
